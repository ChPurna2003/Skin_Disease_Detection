<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Analysis</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container-main">

        <h2 class="title">Skin Disease Analyzer</h2>
        <p class="subtitle">Upload an image and let our AI detect possible skin conditions.</p>

        <form id="uploadForm" enctype="multipart/form-data">
            <label for="fileInput" class="upload-card">
                <img src="https://cdn-icons-png.flaticon.com/512/685/685655.png" width="70" class="mb-3">
                <p><b>Click to select an image</b></p>
                <p>or drag & drop here</p>
                <input type="file" id="fileInput" name="file" hidden>
            </label>

            <button type="submit" class="btn-analyze">Analyze Image</button>
        </form>

        <div class="result-box">
            <h4 class="text-center">Diagnosis Result</h4>
            <p id="diagnosis">Waiting for input...</p>
        </div>

    </div>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
