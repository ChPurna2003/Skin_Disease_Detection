name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - - uses: actions/checkout@v4

    - uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd Skin_Disease_Detection
          git pull
          sudo docker stop $(sudo docker ps -q) || true
          sudo docker build -t skin-app .
          sudo docker run -d -p 5000:5000 skin-app
